services:
  mcp:
    image: tintatlanta-mcp-server:${RELEASE_SHA:?RELEASE_SHA is required}
    build:
      context: .
      dockerfile: Dockerfile.atlas
    container_name: tintatlanta-mcp-server-atlas
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - UPSTREAM_URL=https://agents.tintatlanta.com/api
      - ALLOWED_MCP_HOSTS=agents.tintatlanta.com,tintatlanta-mcp.askboswell.com
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.tintatlanta-mcp-http.rule=Host(`tintatlanta-mcp.askboswell.com`)
      - traefik.http.routers.tintatlanta-mcp-http.entrypoints=http
      - traefik.http.routers.tintatlanta-mcp-http.middlewares=tintatlanta-mcp-https
      - traefik.http.middlewares.tintatlanta-mcp-https.redirectscheme.scheme=https
      - traefik.http.routers.tintatlanta-mcp.rule=Host(`tintatlanta-mcp.askboswell.com`)
      - traefik.http.routers.tintatlanta-mcp.entrypoints=https
      - traefik.http.routers.tintatlanta-mcp.tls=true
      - traefik.http.routers.tintatlanta-mcp.tls.certresolver=letsencrypt
      - traefik.http.services.tintatlanta-mcp.loadbalancer.server.port=8080
      # agents.tintatlanta.com is the permanent agent front door (Steve-approved
      # 2026-09-19). This container owns /mcp and /health there; the API proxy
      # owns /api and the plain-HTTP redirect. The askboswell routers above
      # stay until their traffic is checked and they are retired.
      - traefik.http.routers.ta-agents-mcp.rule=Host(`agents.tintatlanta.com`) && (Path(`/mcp`) || PathPrefix(`/mcp/`) || Path(`/health`))
      - traefik.http.routers.ta-agents-mcp.entrypoints=https
      - traefik.http.routers.ta-agents-mcp.tls=true
      - traefik.http.routers.ta-agents-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.ta-agents-mcp.service=tintatlanta-mcp
      - org.opencontainers.image.revision=${RELEASE_SHA}
      - org.opencontainers.image.source=https://github.com/stevekrontz-dev/tintatlanta-mcp-server

networks:
  coolify:
    external: true
